<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | Fit Di$trict</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card">

            <div class="login-logo">
                <h1>FIT <span>DI$TRICT</span></h1>
                <p>Fashion. Community. Discovery.</p>
            </div>

            <div class="login-heading">
                <h2>Welcome Back</h2>
                <p>Sign in to continue to Fit Di$trict.</p>
            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input type="email" id="loginEmail" placeholder="Enter your email" required>

                </div>

                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input type="password" id="loginPassword" placeholder="Enter your password" required>

                </div>

                <div class="login-options">

                    <label class="remember-option">

                        <input type="checkbox" id="rememberMe">

                        Remember me

                    </label>

                    <a href="#" id="forgotPassword">
                        Forgot password?
                    </a>

                </div>

                <button type="submit" class="login-btn">
                    Sign In
                </button>

            </form>


            <!-- Prototype Account Selector -->

            <div class="prototype-login">

                <p>
                    PROTOTYPE ACCESS
                </p>

                <span>
                    Select a role to demonstrate the system.
                </span>

                <div class="prototype-buttons">

                    <button type="button" class="role-login-btn" data-role="provider">
                        Provider Demo
                    </button>

                    <button type="button" class="role-login-btn" data-role="admin">
                        SysAdmin Demo
                    </button>

                </div>

            </div>


            <div class="login-footer">

                <p>
                    Don't have an account?
                    <a href="#" id="createAccount">
                        Create Account
                    </a>
                </p>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
